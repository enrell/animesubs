[package]
name = "animesubs-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "animesubs from the command line: run the engine directly or drive the local server"
publish = false

[[bin]]
name = "animesubs-cli"
path = "src/main.rs"

[dependencies]
animesubs-api = { path = "../api" }
animesubs-client = { path = "../client" }
animesubs-server = { path = "../server" }
clap = { version = "4.5", features = ["derive"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
