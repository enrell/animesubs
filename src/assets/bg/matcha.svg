<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gardenLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dde5c8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#f3f4eb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f3f4eb" stop-opacity="0"/>
    </linearGradient>
    <g id="leaf">
      <path d="M0 0 Q 22 -10 44 0 Q 22 10 0 0 Z" fill="#5a7a2e"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#gardenLight)"/>

  <!-- soft dappled light -->
  <g fill="#ffffff">
    <circle cx="400" cy="200" r="120" opacity="0.35"/>
    <circle cx="900" cy="420" r="160" opacity="0.25"/>
    <circle cx="1300" cy="180" r="100" opacity="0.3"/>
    <circle cx="650" cy="780" r="130" opacity="0.2"/>
  </g>

  <!-- bamboo left -->
  <g opacity="0.55">
    <g fill="#5a7a2e">
      <rect x="80" y="-40" width="34" height="240" rx="16"/>
      <rect x="80" y="216" width="34" height="240" rx="16"/>
      <rect x="80" y="472" width="34" height="240" rx="16"/>
      <rect x="80" y="728" width="34" height="300" rx="16"/>
      <rect x="76" y="196" width="42" height="12" rx="6" fill="#4c6826"/>
      <rect x="76" y="452" width="42" height="12" rx="6" fill="#4c6826"/>
      <rect x="76" y="708" width="42" height="12" rx="6" fill="#4c6826"/>
    </g>
    <use href="#leaf" x="114" y="150" transform="rotate(-24 114 150)"/>
    <use href="#leaf" x="114" y="150" transform="rotate(18 114 150) scale(0.9)"/>
    <use href="#leaf" x="114" y="410" transform="rotate(-14 114 410) scale(1.1)"/>
    <use href="#leaf" x="114" y="410" transform="rotate(30 114 410) scale(0.85)"/>
    <use href="#leaf" x="114" y="660" transform="rotate(-32 114 660)"/>
  </g>

  <!-- bamboo mid-right, thinner -->
  <g opacity="0.4">
    <g fill="#5a7a2e">
      <rect x="1230" y="60" width="24" height="200" rx="12"/>
      <rect x="1230" y="276" width="24" height="200" rx="12"/>
      <rect x="1230" y="492" width="24" height="200" rx="12"/>
      <rect x="1227" y="256" width="30" height="10" rx="5" fill="#4c6826"/>
      <rect x="1227" y="472" width="30" height="10" rx="5" fill="#4c6826"/>
    </g>
    <use href="#leaf" x="1254" y="200" transform="rotate(-20 1254 200) scale(0.8)"/>
    <use href="#leaf" x="1254" y="430" transform="rotate(24 1254 430) scale(0.75)"/>
  </g>

  <!-- bamboo far right edge -->
  <g opacity="0.3">
    <g fill="#5a7a2e">
      <rect x="1500" y="-20" width="28" height="230" rx="14"/>
      <rect x="1500" y="226" width="28" height="230" rx="14"/>
      <rect x="1500" y="472" width="28" height="230" rx="14"/>
      <rect x="1496" y="206" width="36" height="10" rx="5" fill="#4c6826"/>
      <rect x="1496" y="452" width="36" height="10" rx="5" fill="#4c6826"/>
    </g>
    <use href="#leaf" x="1500" y="300" transform="rotate(200 1500 300) scale(0.9)"/>
    <use href="#leaf" x="1500" y="560" transform="rotate(160 1500 560) scale(0.8)"/>
  </g>

  <!-- stone path hint -->
  <g fill="#8b937b" opacity="0.3">
    <ellipse cx="500" cy="960" rx="90" ry="22"/>
    <ellipse cx="720" cy="920" rx="70" ry="18"/>
    <ellipse cx="920" cy="965" rx="80" ry="20"/>
  </g>
</svg>
