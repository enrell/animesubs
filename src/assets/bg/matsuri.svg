<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e39a2d" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#e39a2d" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e39a2d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nightWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1c10" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#191410" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#191410" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#nightWarm)"/>

  <!-- lantern glows -->
  <circle cx="260" cy="200" r="170" fill="url(#lanternGlow)"/>
  <circle cx="700" cy="130" r="140" fill="url(#lanternGlow)" opacity="0.8"/>
  <circle cx="1150" cy="230" r="180" fill="url(#lanternGlow)"/>
  <circle cx="1480" cy="110" r="120" fill="url(#lanternGlow)" opacity="0.75"/>

  <!-- hanging lanterns -->
  <g>
    <line x1="260" y1="60" x2="260" y2="150" stroke="#0f0b08" stroke-width="4"/>
    <ellipse cx="260" cy="200" rx="52" ry="62" fill="#e8a33d" opacity="0.9"/>
    <ellipse cx="260" cy="200" rx="52" ry="62" fill="none" stroke="#8a5a1c" stroke-width="3" opacity="0.6"/>
    <path d="M208 200 h104 M214 176 h92 M214 224 h92" stroke="#8a5a1c" stroke-width="3" opacity="0.55" fill="none"/>
    <rect x="236" y="132" width="48" height="12" rx="4" fill="#3a2410"/>
    <rect x="242" y="258" width="36" height="10" rx="4" fill="#3a2410"/>
  </g>
  <g opacity="0.9">
    <line x1="1150" y1="80" x2="1150" y2="180" stroke="#0f0b08" stroke-width="4"/>
    <ellipse cx="1150" cy="230" rx="46" ry="56" fill="#d63f2e" opacity="0.85"/>
    <path d="M1104 230 h92 M1110 208 h80 M1110 252 h80" stroke="#6e1f16" stroke-width="3" opacity="0.6" fill="none"/>
    <rect x="1128" y="164" width="44" height="12" rx="4" fill="#3a2410"/>
    <rect x="1134" y="282" width="32" height="10" rx="4" fill="#3a2410"/>
  </g>

  <!-- pennant strings -->
  <path d="M0 90 Q 400 190 800 120 T 1600 150" fill="none" stroke="#0f0b08" stroke-width="3" opacity="0.8"/>
  <g opacity="0.85">
    <path d="M150 122 l26 4 -16 34 z" fill="#d63f2e"/>
    <path d="M300 148 l26 2 -14 34 z" fill="#e39a2d"/>
    <path d="M450 156 l26 0 -12 34 z" fill="#f0e6d2"/>
    <path d="M600 148 l26 -2 -10 34 z" fill="#d63f2e"/>
    <path d="M750 130 l26 -4 -8 34 z" fill="#e39a2d"/>
    <path d="M950 122 l26 -2 -10 34 z" fill="#f0e6d2"/>
    <path d="M1100 128 l26 0 -12 34 z" fill="#d63f2e"/>
    <path d="M1250 138 l26 2 -14 34 z" fill="#e39a2d"/>
    <path d="M1400 146 l26 4 -16 34 z" fill="#f0e6d2"/>
  </g>

  <!-- ground silhouettes: festival stalls -->
  <g fill="#100b07" opacity="0.92">
    <path d="M0 880 h1600 v120 h-1600 z"/>
    <path d="M180 880 v-70 h200 v70 z"/>
    <path d="M160 810 h240 l-24 -34 h-192 z" fill="#1c1209"/>
    <path d="M1200 880 v-64 h180 v64 z"/>
    <path d="M1182 816 h216 l-20 -30 h-176 z" fill="#1c1209"/>
  </g>
  <g fill="#e39a2d" opacity="0.35">
    <circle cx="240" cy="846" r="7"/>
    <circle cx="300" cy="846" r="7"/>
    <circle cx="1260" cy="842" r="6"/>
    <circle cx="1316" cy="842" r="6"/>
  </g>
