[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/engine",
    "crates/api",
    "crates/server",
    "crates/client",
    "crates/cli",
]
# `cargo build` / `cargo test` at the root skip the desktop app, so the engine,
# server and CLI build on machines without the WebKitGTK/GTK system libraries.
# Use `--workspace` (or `-p animesubs`) to include the app.
default-members = [
    "crates/engine",
    "crates/api",
    "crates/server",
    "crates/client",
    "crates/cli",
]

# Moved from src-tauri/Cargo.toml: profiles are only read from the workspace root.
[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = 3 # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.
