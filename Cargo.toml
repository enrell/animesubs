[package]
name = "psyche-subtitle-toolkit"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
wiremock = "0.6"

[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.15"
thiserror = "2.0"
tokio = { version = "1.43", features = ["fs", "macros", "process", "rt-multi-thread"] }
